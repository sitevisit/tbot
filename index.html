<!DOCTYPE html><html>
<head>
    <title>Telegram Bot Controller</title>
</head>
<body><h1>Telegram Bot Running</h1>
<div id="status"></div><script>

const BOT_TOKEN = "8841208085:AAEjZPXO8cZ62MuH62B1t0dSN_HP7WZseWw";

let lastUpdateId = 0;

function getReply(msg){

    msg = msg.toLowerCase().trim();

    if(msg === "hi") return "Hello!";
    if(msg === "/start") return "welcome to vinay chat bot";
    if(msg === "hello") return "Hi there";
    if(msg === "how are you") return "I am fine.";
    if(msg === "bye") return "Goodbye.";

    return "I don't understand that.";
}

async function sendMessage(chatId, text){

    await fetch(
        `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(text)}`
    );

}

async function checkMessages(){

    try{

        const response = await fetch(
            `https://api.telegram.org/bot${BOT_TOKEN}/getUpdates`
        );

        const data = await response.json();

        if(data.result.length === 0){
            return;
        }

        const latest =
            data.result[data.result.length - 1];

        if(latest.update_id > lastUpdateId){

            lastUpdateId = latest.update_id;

            const fname =
                latest.message.from.first_name;

            const chatId =
                latest.message.chat.id;

            const msg =
                latest.message.text || "";

            const reply =
                getReply(msg);

            await sendMessage(
                chatId,
                reply
            );

            document.getElementById(
                "status"
            ).innerHTML +=
            "Received: " + msg +
            "<br>By: " + fname +
            "<br>Replied: " + reply +
            "<br><hr>";

        }

    }
    catch(err){

        console.log(err);

    }

}

setInterval(
    checkMessages,
    5000
);

</script></body>
</html>
