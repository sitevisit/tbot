<!DOCTYPE html>
<html>
<head>
    <title>Telegram Bot Controller</title>
</head>
<body>

<h1>Telegram Bot Running</h1>
<div id="status"></div>

<script>

const BOT_TOKEN = "YOUR_BOT_TOKEN";

let lastUpdateId = 0;

function getReply(msg){

    msg = msg.toLowerCase().trim();

    if(msg === "hi"){ console.log("Hello!"); return "Hello!";}
    if(msg === "hello"){ console.log("Hi there"); return "Hi there";}
    if(msg === "how are you"){console.log("I am fine"); return "I am fine.";}
    if(msg === "bye"){console.log("Goodbye."); return "Goodbye.";}
    console.log("I don't understand that.");
    return "I don't understand that.";
}

async function sendMessage(chatId, text){

    await fetch(
        `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(text)}`
    );

}

async function checkMessages(){

    try{

        const response = await fetch(
            `https://api.telegram.org/bot${BOT_TOKEN}/getUpdates`
        );

        const data = await response.json();

        if(data.result.length === 0){
            return;
        }

        const latest =
            data.result[data.result.length - 1];

        if(latest.update_id > lastUpdateId){

            lastUpdateId = latest.update_id;
            const nam = latest.message.from.first_name+" "+latest.message.from.last_name+"\n";
            const chatId =
                latest.message.chat.id;

            const msg =
                nam+latest.message.text || "";

            const reply =
                getReply(msg);

            await sendMessage(
                chatId,
                reply
            );

            document.getElementById(
                "status"
            ).innerHTML =
            "Processed: " + msg;

        }

    }
    catch(err){

        console.log(err);

    }

}

setInterval(
    checkMessages,
    5000
);

</script>

</body>
</html>
