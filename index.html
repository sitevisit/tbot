<!DOCTYPE html> 
<html> 
<head> 
 <meta charset="UTF-8"> 
 <title>Telegram Bot Dashboard</title>
<style>
*{ box-sizing:border-box; font-family:Arial,sans-serif; }
body{ margin:20px; }
.card{ border:1px solid #ccc; border-radius:10px; padding:15px; margin-bottom:20px; }
input,select{ padding:8px; margin:5px; }
button{ padding:8px 12px; cursor:pointer; }
table{ width:100%; border-collapse:collapse; }
th,td{ border:1px solid #ccc; padding:8px; text-align:left; }
th{ background:#f5f5f5; }
</style>
</head> <body>
<h1>Telegram Bot Dashboard</h1>
<div class="card">
<h2>Add / Update Reply</h2>
<input id="msg" placeholder="Message">
<input id="reply" placeholder="Reply">
<select id="type"> <option value="exact">exact</option> <option value="contains">contains</option> 
</select><br>
<button onclick="addReply()">Add</button>
</div>
<div class="card">
<h2>Bot Knowledge</h2>
<table>
<thead> <tr> <th>Message</th> <th>Reply</th> <th>Type</th> <th>Actions</th> </tr> </thead>
<tbody id="brainTable"></tbody>
</table>
</div>
<div class="card">
<h2>Logs</h2>
<table>
<thead> <tr> <th>Time</th> <th>User</th> <th>Message</th> <th>Reply</th> </tr> </thead>
<tbody id="logsTable"></tbody>
</table>
</div>
<script>
const SCRIPT_URL = "8841208085:AAEjZPXO8cZ62MuH62B1t0dSN_HP7WZseWw";

let lastUpdateId = 0;

/* =========================
   LOAD BRAIN TABLE
========================= */
async function loadBrain() {

  const res = await fetch(SCRIPT_URL + "?action=read");
  const data = await res.json();

  const arr = Array.isArray(data) ? data : [];

  const tbody = document.getElementById("brainTable");
  tbody.innerHTML = "";

  arr.forEach(item => {

    tbody.innerHTML += `
      <tr>
        <td>${item.message}</td>
        <td>${item.reply}</td>
        <td>${item.type}</td>
        <td>
          <button onclick="deleteReply('${item.message}')">Delete</button>
        </td>
      </tr>
    `;
  });
}

/* =========================
   LOAD LOGS
========================= */
async function loadLogs() {

  const res = await fetch(SCRIPT_URL + "?action=logs");
  const data = await res.json();

  const arr = Array.isArray(data) ? data : [];

  const tbody = document.getElementById("logsTable");
  tbody.innerHTML = "";

  arr.forEach(row => {

    tbody.innerHTML += `
      <tr>
        <td>${row[0]}</td>
        <td>${row[1]}</td>
        <td>${row[2]}</td>
        <td>${row[3]}</td>
      </tr>
    `;
  });
}

/* =========================
   ADD REPLY
========================= */
async function addReply() {

  const message = document.getElementById("msg").value;
  const reply = document.getElementById("reply").value;
  const type = document.getElementById("type").value;

  await fetch(
    `${SCRIPT_URL}?action=add&message=${encodeURIComponent(message)}&reply=${encodeURIComponent(reply)}&type=${type}`
  );

  loadBrain();
}

/* =========================
   DELETE
========================= */
function deleteReply(message) {

  fetch(
    `${SCRIPT_URL}?action=delete&message=${encodeURIComponent(message)}`
  ).then(() => loadBrain());
}

/* =========================
   TELEGRAM POLLING
========================= */
async function checkTelegram() {

  const script = document.createElement("script");

  script.src =
    SCRIPT_URL +
    "?action=updates&callback=handleTelegram";

  document.body.appendChild(script);
}

/* =========================
   TELEGRAM HANDLER (JSONP)
========================= */
function handleTelegram(res) {

  console.log("Telegram response:", res);

  if (!res.result) return;

  res.result.forEach(update => {

    if (!update.message) return;

    if (update.update_id <= lastUpdateId) return;

    lastUpdateId = update.update_id;

    const chatId = update.message.chat.id;

    const userMsg =
      (update.message.text || "")
        .toLowerCase()
        .trim();

    matchAndReply(chatId, userMsg);
  });
}

/* =========================
   MATCH BRAIN + REPLY
========================= */
async function matchAndReply(chatId, msg) {

  const res = await fetch(SCRIPT_URL + "?action=read");
  const brain = await res.json();

  let reply = null;

  for (const item of brain) {

    const keyword = (item.message || "").toLowerCase();

    if (item.type === "exact" && msg === keyword) {
      reply = item.reply;
      break;
    }

    if (item.type === "contains" && msg.includes(keyword)) {
      reply = item.reply;
      break;
    }
  }

  if (!reply) return;

  await fetch(
    `${SCRIPT_URL}?action=send&chatId=${chatId}&text=${encodeURIComponent(reply)}`
  );

  console.log("Reply sent:", reply);
}

/* =========================
   INIT
========================= */
loadBrain();
loadLogs();

setInterval(checkTelegram, 5000);
setInterval(loadLogs, 5000);
</script>
</body>
</html>
